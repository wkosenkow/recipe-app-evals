services:
  - type: web
    name: kitchen-companion
    runtime: node
    plan: free
    buildCommand: "cd frontend && npm ci --include=dev && npm run build && cd ../backend && npm ci --include=dev && npm run build"
    startCommand: "cd backend && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      # Must be set explicitly, not left to the localhost:5173 default: CORS now
      # runs with credentials, so this value names an origin permitted to make
      # authenticated cross-origin calls. It also drives the Secure flag
      # indirectly via NODE_ENV, so production must look like production here.
      - key: CLIENT_ORIGIN
        value: https://kitchen-companion-hs8q.onrender.com
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CHAT_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-haiku-latest
      - key: VITE_API_URL
        value: ""
